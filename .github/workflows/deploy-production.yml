name: Deploy Production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

concurrency:
  group: vercel-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-backend:
    name: Deploy backend to Vercel
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    defaults:
      run:
        working-directory: backend

    env:
      VERCEL_ORG_ID: team_7RJcn6QZlcWe72RlKn2hmEiB
      VERCEL_PROJECT_ID: prj_jl72cTQf5g4I7QufLilrPTtVuWDD
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@54.15.1

      - name: Verify Vercel credentials
        run: test -n "$VERCEL_TOKEN"

      - name: Pull backend production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build backend deployment
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy backend to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  deploy-frontend:
    name: Deploy frontend to Vercel
    needs:
      - deploy-backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    defaults:
      run:
        working-directory: frontend

    env:
      VERCEL_ORG_ID: team_7RJcn6QZlcWe72RlKn2hmEiB
      VERCEL_PROJECT_ID: prj_M6g7YxEPqrw6diHeMbHtusxmcYUI
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@54.15.1

      - name: Verify Vercel credentials
        run: test -n "$VERCEL_TOKEN"

      - name: Pull frontend production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build frontend deployment
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy frontend to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
